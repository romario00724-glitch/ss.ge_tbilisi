# Тимчасова пробна перевірка (22.10.2026): що саме ss.ge блокує для серверів GitHub.
# Лише ручний запуск, без секретів і Telegram, state.json не чіпає. Після перевірки — видалити.
name: probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install -q "curl_cffi>=0.10"
      - shell: python
        run: |
          import re, urllib.request, urllib.error
          from curl_cffi import requests as r

          def show(name, status, headers, text):
              title = re.search(r"<title>(.*?)</title>", text or "", re.S | re.I)
              print(f"{name}: HTTP {status} | server={headers.get('server')} "
                    f"cf-mitigated={headers.get('cf-mitigated')} | "
                    f"title={(title.group(1).strip()[:60] if title else '-')} | "
                    f"__NEXT_DATA__={'так' if '__NEXT_DATA__' in (text or '') else 'ні'} | "
                    f"credentialsToken={'так' if 'credentialsToken' in (text or '') else 'ні'}")

          def cffi(name, url, imp="chrome", post=None):
              try:
                  h = {"Accept-Language": "ru"}
                  x = (r.post(url, json=post, headers=h, impersonate=imp, timeout=30) if post is not None
                       else r.get(url, headers=h, impersonate=imp, timeout=30))
                  show(name, x.status_code, x.headers, x.text)
              except Exception as e:
                  print(f"{name}: помилка {str(e)[:100]}")

          def plain(name, url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36", "Accept-Language": "ru"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as x:
                      show(name, x.status, x.headers, x.read().decode("utf-8", "replace"))
              except urllib.error.HTTPError as e:
                  show(name, e.code, e.headers, e.read().decode("utf-8", "replace"))
              except Exception as e:
                  print(f"{name}: помилка {str(e)[:100]}")

          home = "https://home.ss.ge/ru/"
          for imp in ("chrome", "chrome131", "safari", "firefox"):
              cffi(f"головна ({imp})", home, imp)
          plain("головна (urllib)", home)
          cffi("сторінка пошуку", "https://home.ss.ge/ka/udzravi-qoneba")
          cffi("robots.txt", "https://home.ss.ge/robots.txt")
          cffi("account.ss.ge", "https://account.ss.ge/.well-known/openid-configuration")
          cffi("jobs.ss.ge", "https://jobs.ss.ge/ka")
          cffi("ss.ge/auto", "https://ss.ge/ka/auto")
          cffi("API без ключа (401 = API відкрите)", "https://api-gateway.ss.ge/v1/RealEstate/LegendSearch",
               post={"realEstateDealType": 1, "realEstateType": 5, "cityIdList": [95], "page": 1, "pageSize": 16})
